<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聯絡 — C. Y.</title>
  <meta name="description" content="寫信給C. Y.。交通資料、前端、合作或只是打招呼都可以。">
  <meta name="theme-color" content="#f7f4ee">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <script>
    try {
      var t = localStorage.getItem('cy_theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
    document.documentElement.classList.add('js');
  </script>
  <link rel="stylesheet" href="paper.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="brand">
        <span class="brand-mark">C. Y.</span>
        </a>
      <nav class="site-nav" id="nav-links" aria-label="主要導覽">
        <a href="index.html" class="nav-link">首頁</a>
        <a href="about.html" class="nav-link">關於</a>
        <a href="projects.html" class="nav-link">專案</a>
        <a href="blog.html" class="nav-link">文章</a>
        <a href="friends.html" class="nav-link">友站</a>
        <a href="contact.html" class="nav-link active">聯絡</a>
      </nav>
      <div class="header-actions">
        <button id="theme-toggle" class="icon-btn" aria-label="切換深色模式" title="切換深色模式"></button>
        <button id="mobile-menu-toggle" class="icon-btn mobile-only" aria-label="開啟選單" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <line x1="3" y1="7" x2="21" y2="7"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="17" x2="21" y2="17"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="page">

    <div class="blog-head reveal">
      <p class="eyebrow">聯絡</p>
      <h1 class="blog-title">寫信給我</h1>
      <p class="blog-sub">
        交通資料、前端實作、合作提案，或者只是想聊火車，都歡迎。
        我通常兩三天內回，忙的時候會晚一點。
      </p>
    </div>

    <div style="display: grid; grid-template-columns: 1.6fr 1fr; gap: 1px; background: var(--rule); border-top: 1px solid var(--rule);" class="contact-grid">

      <!-- 表單 -->
      <div style="background: var(--paper); padding: 48px 0 60px; padding-right: 40px;" class="contact-form-wrap">
        <p class="mono" style="color: var(--ink-faint); margin: 0 0 28px;">FORM</p>

        <form id="contact-form">
          <div class="field">
            <label for="name" class="field-label">怎麼稱呼</label>
            <input type="text" id="name" name="name" class="field-input" placeholder="你的名字" required>
          </div>

          <div class="field">
            <label for="email" class="field-label">電子郵件</label>
            <input type="email" id="email" name="email" class="field-input" placeholder="you@example.com" required>
            <p class="field-help">只會用來回覆這封信。</p>
          </div>

          <div class="field">
            <label for="subject" class="field-label">主題</label>
            <input type="text" id="subject" name="subject" class="field-input" placeholder="例如：想聊聊 TDX 資料的處理方式" required>
          </div>

          <div class="field">
            <label for="message" class="field-label">內容</label>
            <textarea id="message" name="message" class="field-textarea" rows="7" placeholder="想說的話…" required></textarea>
          </div>

          <button type="submit" class="btn btn-primary">送出（示範）</button>

          <p class="field-help" style="margin-top: 16px;">
            這是前端示範表單，按下送出不會真的寄出。要聯絡我，請直接寫信到右側的信箱。
          </p>
        </form>
      </div>

      <!-- 聯絡資訊 -->
      <div style="background: var(--paper); padding: 48px 0 60px; padding-left: 40px;" class="contact-info">
        <div style="margin-bottom: 48px;">
          <p class="mono" style="color: var(--ink-faint); margin: 0 0 10px;">EMAIL</p>
          <a href="mailto:xiaoyouwu5@gmail.com" style="font-size: 1.05rem; color: var(--accent); border-bottom: 1px solid var(--rule-strong); padding-bottom: 2px;">
            xiaoyouwu5@gmail.com
          </a>
          <div style="margin-top: 16px;">
            <button class="btn btn-secondary" data-copy="xiaoyouwu5@gmail.com" style="padding: 9px 16px; font-size: 13px;">複製</button>
          </div>
        </div>

        <div style="margin-bottom: 48px;">
          <p class="mono" style="color: var(--ink-faint); margin: 0 0 10px;">GITHUB</p>
          <a href="https://github.com/Chenyou0113" target="_blank" rel="noopener noreferrer" style="font-size: 1.05rem; color: var(--accent); border-bottom: 1px solid var(--rule-strong); padding-bottom: 2px;">
            @Chenyou0113
          </a>
          <p style="font-size: 0.9rem; color: var(--ink-muted); margin: 12px 0 0;">
            開源專案與程式碼都在這裡。
          </p>
        </div>

        <div>
          <p class="mono" style="color: var(--ink-faint); margin: 0 0 10px;">回覆時間</p>
          <p style="font-size: 0.95rem; color: var(--ink-soft); margin: 0;">
            通常 2–3 天。如果是急事，主旨寫清楚，我會優先看。
          </p>
        </div>
      </div>

    </div>

  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span class="footer-mono">© 2026 C. Y. · 手寫 HTML，沒有框架</span>
      <div class="footer-links">
        <a href="https://github.com/Chenyou0113" target="_blank" rel="noopener noreferrer" class="footer-link">GitHub</a>
        <a href="blog.html" class="footer-link">文章</a>
        <a href="friends.html" class="footer-link">友站</a>
        <a href="index.html" class="footer-link">首頁</a>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
